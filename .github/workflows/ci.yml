name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  local-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the reader's verifier (pinned)
        run: pip install warrant-verify==0.11.0
      - name: Vendored verifier vs npm, demo, contracts, counter-vectors (Python = JS), mutants
        run: NPM=1 sh scripts/local-ci.sh
